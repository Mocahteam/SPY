<!DOCTYPE html>
<html lang="en-us">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<title>SPY</title>
		<link rel="icon" type="image/png" href="TemplateData/favicon.png">
		<link rel="stylesheet" href="TemplateData/styleGame.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	</head>
	<body onresize="resizeCanvas()">
	<div id="unity-container">
		<div class="d-flex align-items-start gap-2">
			<button id="showHideBanner" class="btn btn-info btn-sm toggle-header" data-bs-toggle="collapse" data-bs-target="#unity-header" aria-label="Afficher ou masquer le bandeau"></button>

			<header id="unity-header" class="collapse show container-fluid p-2 border border-info rounded-3 bg-light" role="banner">

				<div class="d-flex flex-wrap align-items-center gap-3">

					<!-- TTS -->
					<div class="d-flex flex-wrap align-items-center gap-3">
						<div class="form-check form-switch">
							<input class="form-check-input" type="checkbox" id="switchTTS" onclick="initSound(this)" disabled data-bs-toggle="collapse" data-bs-target="#TTSConfig" aria-controls="TTSConfig" aria-expanded="false">
							<label id="labelSwitchTTS" class="form-check-label" for="switchTTS">
							  Synthèse vocale
							</label>
						</div>

						<div id="TTSConfig" class="collapse mt-2">
							<fieldset class="border rounded p-2 d-flex flex-wrap align-items-center gap-3">
							  <legend id="legendTTS" class="visually-hidden">
								Options de synthèse vocale
							  </legend>

							  <div class="form-check">
								<input class="form-check-input" type="radio" name="radioTarget" id="TTS_all">
								<label id="TTS_all_label" class="form-check-label" for="TTS_all">
								  Tout
								</label>
							  </div>

							  <div class="form-check">
								<input class="form-check-input" type="radio" name="radioTarget" id="TTS_briefing" checked>
								<label id="TTS_briefing_label" class="form-check-label" for="TTS_briefing">
								  Consignes
								</label>
							  </div>

							  <div class="form-check">
								  <label id="labelSpeed" for="speedTTS" class="form-label mt-2">
									Vitesse de la voix
								  </label>
								  <input type="range" class="form-range" id="speedTTS" min="0.1" max="10" step="0.1" value="1">
							  </div>
							</fieldset>
						</div>
					</div>

					<!-- Import settings -->
					<div class="d-flex align-items-center">
					  <label id="proxyLoadSettings" for="files-selector-settings" class="btn btn-primary visually-hidden">
						Importer des paramètres
					  </label>
					  <input id="files-selector-settings" type="file" accept=".json" multiple class="visually-hidden" disabled>
					</div>
					
					<!-- Import missions/scenario -->
					<div class="d-flex align-items-center">
					  <label id="proxyLoadMissions" for="files-selector-missions" class="btn btn-success visually-hidden">
						Importer des scénarios et des missions
					  </label>
					  <input id="files-selector-missions" type="file" accept=".xml" multiple class="visually-hidden" disabled>
					</div>

					<!-- Lien accessibilité -->
					<nav class="ms-auto">
					  <a id="accessLink" href="accessibility_fr.html" target="_blank" class="link-primary fw-semibold">
						Accessibilité du jeu
					  </a>
					</nav>

					<!-- Plein écran -->
					<div class="d-flex align-items-center gap-2">
					  <span id="unity-build-title" class="fw-semibold">
						Agrandir&nbsp;:
					  </span>

					  <button id="unity-fullscreen-button" class="btn btn-outline-secondary" aria-label="Passer en plein écran"></button>
					</div>

				</div>
			</header>
		</div>
		<div id="fullscreen-container" class="position-relative">
			<canvas id="unity-canvas" tabindex="0" role="application" aria-label="SPY" aria-describedby="game-help"></canvas>
			<div id="unity-loading-bar">
				<div id="unity-logo"></div>
				<div id="unity-progress-bar-empty">
					<div id="unity-progress-bar-full"></div>
				</div>
			</div>
			<div id="unity-mobile-warning"></div>
			<audio id="playback"></audio>
			<div id="video-container" class="pe-none visually-hidden position-absolute overflow-hidden">
				<video id="cinematic" controls="controls" class="pe-auto position-absolute" style="object-fit:fill;"></video>
			</div>
			<!-- L'exposition de l'interface du jeu passe par ces deux balises et par l'attribut "aria-activedescendant" qui est injecté au canvas dynamiquement (voir la fonction sendToScreenReader ci-dessous). Le principe de ces deux slots et d'alterner via le aria-activedescendant entre les deux afin de forcer le lecteur d'écran à exposer son contenu. Le role "application" est important ici car il permet de maintenir le lecteur d'écran en mode formulaire et non navigation. En mode formulaire le lecteur d'écran délègue les inputs à l'application (c'est ce que l'on veut dans notre cas) en mode navigation Unity ne reçoit plus les évènements clavier de navigation. -->
			<div id="screenReader-slot-a" role="application" class="visually-hidden"></div>
			<div id="screenReader-slot-b" role="application" class="visually-hidden"></div>
			<!-- Cette solution est "risquée" dans la mesure où le rôle "application" est réputé pour devoir être utilisé avec précaution. En effet ce rôle a pour effet que toute interprétation spéciale des structures HTML et des widgets sera suspendue, et le contrôle sera entièrement remis à l'application web pour gérer l'interaction par la souris, le clavier ou le toucher. Dans notre cas c'est exactement ce que l'on veut notemment sur le canvas, mais ici on définit aussi nos deux slots comme des applications liés au canevas via le aria-activedescendant. Pourquoi ce choix ? Une autre solution pourrait consister à utiliser le role "menuitem" qui maintient aussi le lecteur d'écran en mode formulaire tout en étant plus explicite sur l'objet pointé (en l'occurence l'item d'un menu). L'effet de bord de cette approche est que le navigateur expose à l'utilisateur le nombre d'item disponible dans le menu et la position de celui focalisé ce qui ajoute un "1 sur 2" ou "2 sur 2" à la fin de la description ce qui ne reflète pas la réalité de l'interface. L'avantage du role application est qu'il n'est pas un rôle d'élément d'ensemble et donc le navigateur ne cherche pas à calculer sa position et évite donc cet artefact dans la description. Le système ci-dessus a été testé avec Chrome/Firefox et NVDA et marche bien, à tester avec JAWS et VoiceOver pour vérfier s'ils arrivent aussi à retrouver leurs petits... Pour mémoire voici l'appriche avec les "menuitem" :
			<div role="menu" aria-label="Interface du jeu (extrait)">
				<div id="screenReader-slot-a" role="menuitem" class="visually-hidden"></div>
				<div id="screenReader-slot-b" role="menuitem" class="visually-hidden"></div>
			</div> -->
		</div>
		<span id="TextToSpeechSpan" style="visibility:hidden;" ></span>
		<p id="game-help" class="visually-hidden">Zone interactive du jeu, appuyez sur Shift+Échap pour en sortir.</p>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

	<script>
		var container = document.querySelector("#unity-container");
		var canvas = document.querySelector("#unity-canvas");
		var loadingBar = document.querySelector("#unity-loading-bar");
		var progressBarFull = document.querySelector("#unity-progress-bar-full");
		var fullscreenButton = document.querySelector("#unity-fullscreen-button");
		var warningBanner = document.querySelector("#unity-mobile-warning");

		// détection de la langue
		var lang = "";
		const params = new URLSearchParams(window.location.search);
		if (params.get("lang") != null){
			if (params.get("lang") == "fr")
				lang = "fr";
			else if (params.get("lang") == "en")
				lang = "en";
		}
		if (lang == ""){
			if ((navigator.language && navigator.language.includes("fr")) || (navigator.userLanguage && navigator.userLanguage.includes("fr")))
				lang = "fr";
			else
				lang = "en";
		}
		
		// Ajout au document de fonctions pour pouvoir les appeler dans le plugin Unity
		document.updateLang = updateLang;
		document.tryToCopy = tryToCopy;
		document.sendToScreenReader = sendToScreenReader;
		document.quitFullScreen = quitFullScreen;
		document.resetFullScreen = resetFullScreen;
		document.playSound = playSound;
		document.stopSound = stopSound;
		document.setCinematic = setCinematic;
		document.playCinematic = playCinematic;
		document.pauseCinematic = pauseCinematic;
		document.stopCinematic = stopCinematic;
		document.getVideoWidth = getVideoWidth;
		document.getVideoHeight = getVideoHeight;
		document.setVideoPosition = setVideoPosition;
		document.kbLayout_Fetch = kbLayout_Fetch;
		
		document.updateLang(lang);

		// Shows a temporary message banner/ribbon for a few seconds, or
		// a permanent error message on top of the canvas if type=='error'.
		// If type=='warning', a yellow highlight color is used.
		// Modify or remove this function to customize the visually presented
		// way that non-critical warnings and error messages are presented to the
		// user.
		function unityShowBanner(msg, type) {
			function updateBannerVisibility() {
			  warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
			}
			var div = document.createElement('div');
			div.innerHTML = msg;
			warningBanner.appendChild(div);
			if (type == 'error') div.style = 'background: red; padding: 10px;';
			else {
			  if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
			  setTimeout(function() {
				warningBanner.removeChild(div);
				updateBannerVisibility();
			  }, 5000);
			}
			updateBannerVisibility();
		}
		
		var alreadyNotified = false;
		
		// Cette fonction est nécessaire pour que la synthèse vocale fonctionne sur iPhone. Il faut qu'une première "utterance" soit jouée directement sur le click de l'utilisateur. Donc on joue une "utterance" vide
		function initSound(cb_TTS){
			if (cb_TTS.checked == true){
				// notification pour iPhone and co pour recommander de brancher des écouteurs, sinon on n'entend rien...
				var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
				if (isIOS && !alreadyNotified) {
					alert(lang == "fr" ? "Utilisez des écouteurs pour écouter la synthèse vocale..." : "Use headphones to listen to text-to-speech...");
					alreadyNotified = true;
				}
				let utterance = new SpeechSynthesisUtterance(" ");
				utterance.lang = lang == "fr" ? "fr-FR" : "en-US";
				window.speechSynthesis.speak(utterance);
				
				document.getElementById('TTSConfig').style.visibility = 'visible';
			} else {
				document.getElementById('TTSConfig').style.visibility = 'hidden';
			}
			// See TTSSystem
			window.unityInstance.SendMessage('Main_Loop', 'toggleTTS');
		}

        // Configuration du MutationObserver
        const targetNode = document.getElementById('TextToSpeechSpan');
        const configObserver = { childList: true, subtree: true, characterData: true };

        const callback = function(mutationsList, observer) {
			if (document.getElementById('switchTTS').checked == true){
				for (const mutation of mutationsList) {
					if (mutation.target.id === 'TextToSpeechSpan') {
						// Annuler toute synthèse vocale en cours
						if (window.speechSynthesis.speaking) {
							window.speechSynthesis.cancel();
						}
						let utterance = new SpeechSynthesisUtterance(targetNode.innerHTML);
						utterance.lang = lang == "fr" ? "fr-FR" : "en-US";
						utterance.rate = document.getElementById('speedTTS').value; // vitesse de lecture 
						window.speechSynthesis.speak(utterance);
					}
				}
			}
        };

        const observer = new MutationObserver(callback);
        observer.observe(targetNode, configObserver);
		// End TTS section

		var version = {{{ JSON.stringify(PRODUCT_VERSION) }}};

		// choose the data file based on whether there's support for the ASTC texture compression format
		// default use DXT
		var dataFile = "/WebGL_Desktop(DXT)"+version+".data.unityweb";
		// check if ASTC is supported                                  
		var c = document.createElement("canvas");                                 
		var gl = c.getContext("webgl");                                      
		var gl2 = c.getContext("webgl2");                                    
		if ((gl && gl.getExtension('WEBGL_compressed_texture_astc')) || (gl2 &&   
			  gl2.getExtension('WEBGL_compressed_texture_astc'))) {             
			dataFile = "/WebGL_Mobile(ASTC)"+version+".data.unityweb";
		}
		
		// log which webgl version is used
		if (!gl2) {
		  if (typeof WebGL2RenderingContext !== 'undefined') {
			console.log('your browser appears to support WebGL2 but it might be disabled. Try updating your OS and/or video card drivers');
		  } else {
			if (!gl)
				console.log('your browser has no WebGL1 or WebGL2 support at all'); 
			else
				console.log('your browser has no WebGL2 support but has WebGL1'); 
		  }
		} else {
		  console.log('webgl2 works!');
		}
		
		var buildUrl = version + "/Build";
		var loaderUrl = buildUrl + "/WebGL_Desktop(DXT)"+version+".loader.js";
		console.log("Loading: "+buildUrl+dataFile);
		var config = {
			dataUrl: buildUrl + dataFile,
			frameworkUrl: buildUrl + "/WebGL_Desktop(DXT)"+version+".framework.js.unityweb",
#if USE_THREADS
			workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
			codeUrl: buildUrl + "/WebGL_Desktop(DXT)"+version+".wasm.unityweb",
#endif
#if SYMBOLS_FILENAME
			symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
			streamingAssetsUrl: version + "/StreamingAssets",
			companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
			productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
			productVersion: version,
			showBanner: unityShowBanner,
		};

		// By default Unity keeps WebGL canvas render target size matched with
		// the DOM size of the canvas element (scaled by window.devicePixelRatio)
		// Set this to false if you want to decouple this synchronization from
		// happening inside the engine, and you would instead like to size up
		// the canvas DOM size and WebGL render target sizes yourself.
		// config.matchWebGLToCanvasSize = false;
		
		var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
		if (isMobile) {
			unityShowBanner(lang == "fr" ? "Certains dispositifs mobiles peuvent manquer de mémoire pour charger le jeu. Tentative de chargement : Veuillez patienter, chargement en cours...<br><br>Conseil&nbsp;: Tenez votre appareil en mode paysage." : "Some mobile devices could have low memory to load the game. Try to load: please wait, loading...<br><br>Advice: Hold your device in landscape mode.");
			var meta = document.createElement('meta');
			meta.name = 'viewport';
			meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
			document.getElementsByTagName('head')[0].appendChild(meta);
			
			// To lower canvas resolution on mobile devices to gain some
			// performance, uncomment the following line:
			// config.devicePixelRatio = 1;
			
		}

		loadingBar.style.display = "block";
		
		var rect = canvas.getBoundingClientRect();
		canvas.style.height = (window.innerHeight-rect.top-4)+"px";
					
		var script = document.createElement("script");
		script.src = loaderUrl;
		var unityInstance = null;
		script.onload = () => {
			createUnityInstance(canvas, config, (progress) => {
				progressBarFull.style.width = 100 * progress + "%";
			}).then((instance) => {
				unityInstance = instance;

				loadingBar.style.display = "none";

				fullscreenButton.onclick = () => {
					var fullscreenContainer = document.getElementById("fullscreen-container");
					fullscreenContainer.requestFullscreen();
				};
				
				const fileSelectorMissions = document.getElementById('files-selector-missions');
				fileSelectorMissions.addEventListener('change', (event) => {
					const fileList = event.target.files;
					for (let file of fileList){
						var reader = new FileReader();
						reader.onload = function(event){
							const data = {name: file.name, content: event.target.result};
							// see TitleScreenSystem
							unityInstance.SendMessage('Main_Loop', 'importLevelOrScenario', JSON.stringify(data));
						};
						reader.readAsText(file);
					}
					fileSelectorMissions.value = "";
				});
				
				const fileSelectorSettings = document.getElementById('files-selector-settings');
				fileSelectorSettings.addEventListener('change', (event) => {
					const fileList = event.target.files;
					for (let file of fileList){
						var reader = new FileReader();
						reader.onload = function(event){
							const data = {name: file.name, content: event.target.result};
							// see SettingsManager
							unityInstance.SendMessage('Main_Loop', 'importSettingsFromJS', JSON.stringify(data));
						};
						reader.readAsText(file);
					}
					fileSelectorSettings.value = "";
				});
			
				// parse url parameters
				const queryString = window.location.search;
				const urlParams = new URLSearchParams(queryString);
				const levelToLoad = urlParams.get('level');
				if (levelToLoad != null){
					// see ConnexionManager
					console.log("Ask to Load level from URL: "+levelToLoad);
					unityInstance.SendMessage('Main_Loop', 'askToLoadLevel', levelToLoad);
				}
				const silent = urlParams.get('silent');
				if (silent == null)
					// see ConnexionManager
					unityInstance.SendMessage('Main_Loop', 'enableSendStatement');
				
			}).catch((message) => {
				var msg = lang == "fr" ? "Une erreur s'est produite lors du chargement du jeu (voir la console pour plus de détails)." : "Error occurs on loading (see console for details).";
				var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
				if (isSafari)
					msg += lang == "fr" ? "\nEssayer d'utiliser le navigateur Chrome ou Firefox" : "\nTry to use Chrome or Fiferox";
				else if (isMobile)
					msg += lang == "fr" ? "\nVotre dispositif mobile ne contient peut être pas assez de mémoire pour charger le jeu, essayer de recharger la page depuis un ordinateur avec le navigateur Chrome ou Firefox de préférence." : "\nYour mobile device seems to not contains enough memory to load the game, try to reload the page on a computer with Chrome or Firefox.";
				else
					msg += lang == "fr" ? "\nEssayez de rafraîchir la page..." : "\nTry to reload the page...";
				alert(msg);
				console.log(message);
			});
		};
		
		var isPreviouslyInFullscreen = false;
		function quitFullScreen(){
			if (!!document.fullscreenElement || !!document.webkitFullscreenElement || !!document.mozFullScreenElement){
				isPreviouslyInFullscreen = true;
				if (document.exitFullscreen)
					document.exitFullscreen();
				else if (document.webkitExitFullscreen)
					document.webkitExitFullscreen();
				else if (document.mozCancelFullScreen)
					document.mozCancelFullScreen();
			}else
				isPreviouslyInFullscreen = false;
		}
		
		function resetFullScreen(){
			if (isPreviouslyInFullscreen){
				var fullscreenContainer = document.getElementById("fullscreen-container");
				fullscreenContainer.requestFullscreen();
				isPreviouslyInFullscreen = false;
			}
		}
		
        function resizeCanvas(){
			var rect = canvas.getBoundingClientRect();
			canvas.style.height = (window.innerHeight-rect.top-4)+"px";
        }
		
		function updateLang(newLang){
			lang = newLang;
			document.getElementById("proxyLoadMissions").innerHTML = lang == "fr" ? "Importer des scénarios et des missions" : "Import scenarios and missions";
			document.getElementById("proxyLoadSettings").innerHTML = lang == "fr" ? "Importer des paramètres" : "Import settings";
			document.getElementById("unity-build-title").innerHTML = lang == "fr" ? "Agrandir&nbsp;:" : "Enlarge:";
			document.getElementById("labelSwitchTTS").innerHTML = lang == "fr" ? "Synthèse vocale" : "Text-to-speech";
			document.getElementById("labelSpeed").innerHTML = lang == "fr" ? "Vitesse de la voix" : "Speech rate";
			document.getElementById("TTS_all_label").innerHTML = lang == "fr" ? "Tout" : "All";
			document.getElementById("game-help").innerHTML = lang == "fr" ? "Zone interactive du jeu, appuyez sur Shift+Échap pour en sortir." : "Interactive game zone, press Shift+Escape to exit.";
			document.getElementById("showHideBanner").ariaLabel = lang == "fr" ? "Afficher ou masquer le bandeau" : "Show or hide the banner";
			document.getElementById("unity-fullscreen-button").ariaLabel = lang == "fr" ? "Passer en plein écran" : "Switch to full screen";
			
			document.getElementById("TTS_briefing_label").innerHTML = lang == "fr" ? "Consignes" : "Instructions";
			document.getElementById("accessLink").innerHTML = lang == "fr" ? "Accessibilité du jeu" : "Game accessibility";
			document.getElementById("accessLink").href = lang == "fr" ? "accessibility_fr.html" : "accessibility.html";
			document.getElementById("legendTTS").innerHTML = lang == "fr" ? "Options de synthèse vocale" : "Text-to-speech options";
		}
		
		// Fonction de fallback pour les navigateurs qui ne supportent pas l'API moderne
		function fallbackCopyTextToClipboard(text) {
			const textArea = document.createElement("textarea");
			textArea.value = text;
			textArea.style.position = "fixed";
			textArea.style.left = "-999999px";
			textArea.style.top = "-999999px";
			document.body.appendChild(textArea);
			textArea.focus();
			textArea.select();
			
			errorMsg = (lang == "fr" ? "Erreur de copie, essayez à nouveau avec le code suivant : " : "Copy fail, try again with following code: ")+text;
			
			try {
				const successful = document.execCommand('copy');
				if (successful) {
					console.log("le presse-papier est correctement paramétré : " + text);
				} else {
					alert(errorMsg);
				}
			} catch (err) {
				alert(errorMsg);
			} finally {
				document.body.removeChild(textArea);
			}
		}

		// Fonction principale
		async function tryToCopy(text) {
			// Vérifier si l'API Clipboard moderne est disponible
			if (navigator.clipboard && navigator.clipboard.writeText) {
				try {
					await navigator.clipboard.writeText(text);
					console.log("écriture presse-papier : " + text);
				} catch (err) {
					console.log("Clipboard API échouée, utilisation du fallback : " + err);
					// Si l'API moderne échoue, utiliser le fallback
					fallbackCopyTextToClipboard(text);
				}
			} else {
				// L'API moderne n'est pas disponible, utiliser directement le fallback
				console.log("Clipboard API non disponible, utilisation du fallback");
				fallbackCopyTextToClipboard(text);
			}
		}
		
		function playSound(url){
			var playback = document.getElementById("playback");
			playback.src = url;
			playback.play()
		}
		
		function stopSound(){
			var playback = document.getElementById("playback");
			playback.src = "";
		}
		
		function setCinematic(url){
			var cinematic = document.getElementById("cinematic");
			cinematic.src = url;
			cinematic.load();
			var viewport = document.getElementById("video-container");
			viewport.classList.remove("visually-hidden");
		}
		
		function playCinematic(){
			var cinematic = document.getElementById("cinematic");
			cinematic.play();
			console.log("play");
		}
		
		function pauseCinematic(){
			var cinematic = document.getElementById("cinematic");
			cinematic.pause();
			console.log("pause");
		}
		
		function stopCinematic(){
			var cinematic = document.getElementById("cinematic");
			cinematic.pause();
			cinematic.src = "";
			cinematic.load();
			var viewport = document.getElementById("video-container");
			viewport.classList.add("visually-hidden");
		}
		
		function getVideoWidth(){
			var cinematic = document.getElementById("cinematic");
			return cinematic.videoWidth;
		}
		
		function getVideoHeight(){
			var cinematic = document.getElementById("cinematic");
			return cinematic.videoHeight;
		}
		
		function setVideoPosition(viewportX, viewportY, viewportWidth, viewportHeight, videoX, videoY, videoWidth, videoHeight) {
			const canvasRect = canvas.getBoundingClientRect();

			// Taille du rendu Unity
			const unityWidth = canvas.width;
			const unityHeight = canvas.height;

			// Conversion Unity -> CSS
			const scaleX = canvasRect.width / unityWidth;
			const scaleY = canvasRect.height / unityHeight;

			const viewport = document.getElementById("video-container");

			viewport.style.left = (viewportX * scaleX) + "px";
			viewport.style.top = (viewportY * scaleY) + "px";
			viewport.style.width = (viewportWidth * scaleX) + "px";
			viewport.style.height = (viewportHeight * scaleY) + "px";

			const cinematic = document.getElementById("cinematic");

			cinematic.style.left = (videoX * scaleX) + "px";
			cinematic.style.top = (videoY * scaleY) + "px";
			cinematic.style.width = (videoWidth * scaleX) + "px";
			cinematic.style.height = (videoHeight * scaleY) + "px";
		}

		// Cette fonction vise à informer Unity de layout de clavier (AZERTY, QWERTY, QWERTZ...) utilisé
		function kbLayout_Fetch () {
			var us = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
			// Tous les navigateurs n'exposent pas le layout du clavier. Au moment de ce commentaire : Chrome, Edge et Opera le font, mais Firefox et Safari non. Pour ces deux derniers les raccourcis dans le jeu ne seront donc pas affichés.
			if (!navigator.keyboard || !navigator.keyboard.getLayoutMap) {
				// see HotKeySustem
				window.unityInstance.SendMessage('Main_Loop', 'OnKeyboardLayoutDefined', "undef"); return;
			}
			navigator.keyboard.getLayoutMap().then(function (map) {
				var out = "";
				for (var i = 0; i < 36; i++) {
					var code = (i < 26 ? "Key" : "Digit") + us[i];
					out += (map.get(code) || us[i]).toUpperCase().charAt(0);
				}
				// see HotKeySustem
				window.unityInstance.SendMessage('Main_Loop', 'OnKeyboardLayoutDefined', out);
			}).catch(function () {
				// see HotKeySustem
				window.unityInstance.SendMessage('Main_Loop', 'OnKeyboardLayoutDefined', "undef");
			});
		}
		
		function sendToScreenReader (text){
			if (document.activeElement === canvas){
				var current = canvas.getAttribute("aria-activedescendant");
				var nextId = (current === "screenReader-slot-a") ? "screenReader-slot-b" : "screenReader-slot-a";
				var el = document.getElementById(nextId);
				el.textContent = text;
				canvas.setAttribute("aria-activedescendant", nextId);
			}
		}

		document.body.appendChild(script);
		
		// Détection lorsque le canvas prend le focus
		canvas.addEventListener("focus", () => {
			// see UINavigationManager
			if (window.unityInstance != null)
				window.unityInstance.SendMessage('Main_Loop', 'HTMLcanvasFocus', 1);
		});
		// Détection lorsque le canvas perd le focus
		canvas.addEventListener("blur", () => {
			document.getElementById("screenReader-slot-a").textContent = "";
			document.getElementById("screenReader-slot-b").textContent = "";
			canvas.removeAttribute("aria-activedescendant");
			// see UINavigationManager
			if (window.unityInstance != null)
				window.unityInstance.SendMessage('Main_Loop', 'HTMLcanvasFocus', 0);
		});
		// Détecter une touche spéciale pour quitter le canvas
		canvas.addEventListener("keydown", (event) => {
		  if (event.shiftKey && event.key === "Escape") {
			event.preventDefault(); event.preventDefault(); // Tente d'empêcher l'action par défaut (on le fait volontairement deux fois en particulier pour Firefox qui ouvre le "Gestionnaire de processus" avec ce raccourci)
			// Rediriger le focus vers un élément HTML extérieur
			document.getElementById("showHideBanner").focus();
		  }
		});
		// Désactiver le Ctrl+s côté navigateur pour ne pas proposer la page de sauvegarde de la page
		document.addEventListener('keydown', function(event) {
			// Vérifie si Ctrl+S est pressé (ou Cmd+S sur Mac)
			if ((event.ctrlKey || event.metaKey) && event.key === 's') {
				event.preventDefault(); // Empêche le comportement par défaut du navigateur
			}
		});
	</script>
